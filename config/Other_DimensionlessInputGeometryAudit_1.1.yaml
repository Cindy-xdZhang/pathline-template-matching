  Are the initial-neighbor equality failures observed by
  Verify_DimensionlessDeformationFMT_1.1 job 51088712 explained by the frozen
  parent cache's absolute-coordinate float32 storage and subsequent float32
  centering, or do any rows require a non-quantization geometry explanation?

