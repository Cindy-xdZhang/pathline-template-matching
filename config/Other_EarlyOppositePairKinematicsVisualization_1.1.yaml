    At fixed source ordinal 2, the latest authenticated EarlyOppositePair FMT
    template classifier localizes IVD-p95 vortex regions with flow- and
    scale-block-specific false-positive and false-negative structure.
  results_level_question: >-
    Where do the latest family-held-out template predictions agree or disagree
    with IVD-p95 across the four requested flows?
