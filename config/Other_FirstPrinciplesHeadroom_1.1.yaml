  eligible: calibration_supported_or_spatial_imputed
  ineligible_prediction: negative
  zero_score_top_fraction_eligibility: forbidden
  score_refit_or_recomputation: forbidden

inner_prevalence_estimator:
  label_source: authenticated_nonouter_inner_group_metrics_only
  candidate_rows: current_selected_candidate_id_only
  per_group_prevalence: positive_count_divided_by_sample_count
  stage_1: equal_dataset_source_groups_within_each_inner_family_and_scale_block
  stage_2: equal_four_inner_physical_families_within_each_scale_block
  separate_estimate_per_scale_block: true
  outer_label_use: forbidden

decision_arms:
  order:
    - current_selected_prediction
    - inner_prevalence_top_fraction
    - label_free_exact_1d_two_means
    - outer_group_oracle_max_f1
  current_selected_prediction:
    source: authenticated_prediction_boolean_array
    deployable_under_parent_query_batch_contract: true
    outer_label_use: false
  inner_prevalence_top_fraction:
    fraction: outer_fold_inner_prevalence_estimate_for_same_scale_block
    target_count: ceil_fraction_times_all_valid_group_rows_capped_by_eligible_positive_score_rows
    tie_break: descending_score_then_ascending_center_seed_index
    outer_label_use: false
    deployable_under_parent_query_batch_contract: true
  label_free_exact_1d_two_means:
    population: eligible_rows_within_one_dataset_source_block_group
    objective: globally_minimum_within_cluster_sum_of_squares_over_all_distinct_value_splits
    equal_objective_tie_break: lowest_sorted_split
    positive_cluster: strictly_higher_mean_cluster
    constant_or_fewer_than_two_eligible_scores: all_negative
    outer_label_use: false
    deployable_under_parent_query_batch_contract: true
  outer_group_oracle_max_f1:
    population: eligible_rows_with_strictly_positive_spatial_score
    thresholds: every_distinct_observed_positive_score_plus_all_negative
    threshold_comparison: score_greater_than_or_equal_to_threshold
    tied_scores: never_split
    tie_break: highest_f1_then_fewer_predicted_positives_then_higher_threshold
    outer_label_use: true
    diagnostic_only: true
    deployable: false
    forbidden_uses:
      - method_selection
      - threshold_selection_for_future_data
      - main_result
      - confirmation_claim
  gaussian_mixture:
    enabled: false
    reason: omitted_to_avoid_an_additional_unstable_model_in_this_low_cost_ordering_vs_calibration_diagnostic

metrics:
  classification:
    - accuracy
    - f1
    - balanced_accuracy
    - precision
    - recall
    - true_positive
    - false_positive
    - true_negative
    - false_negative
  ranking:
    - average_precision
    - auroc
  ranking_score_for_all_arms: authenticated_current_spatial_score
  per_group_unit: dataset_source_scale_block
  family_block_macro: equal_dataset_source_groups_within_outer_family_and_scale_block
  complete_block_macro: equal_five_outer_family_block_macros
  all_block_macro: equal_ten_outer_family_block_macros
  required_gaps:
    - oracle_f1_minus_current_f1
    - oracle_f1_minus_inner_prevalence_f1
    - oracle_f1_minus_two_means_f1
  target_f1_values: [0.70, 0.80]

interpretation:
  ranking_headroom_supports_calibration_hypothesis_if: outer_group_oracle_family_macro_f1_at_or_above_0_70
  ranking_headroom_rejects_calibration_only_explanation_if: outer_group_oracle_family_macro_f1_below_0_70
  label_free_or_inner_prevalence_arm_at_or_above_0_70: candidate_for_new_pre_registered_nested_validation_only
  no_arm_from_this_posthoc_diagnostic_is_formal_confirmation: true
  oracle_is_an_optimistic_group_specific_upper_bound_not_a_classifier: true

output:
