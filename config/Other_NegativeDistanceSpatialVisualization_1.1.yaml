    result_manifest: /ibex/user/zhanx0o/pathline-template-matching/Other_MainExp31FamilyHeldOutVisualization_1.1/runs/slurm_51029080_86be29698eb6/result_manifest.json
    result_manifest_sha256: 57f03ba16ad8cfa0e1e0a9efd93f2dde7ae5866f173fad20055efb6939d4188e
    visualization_manifest: /ibex/user/zhanx0o/pathline-template-matching/Other_MainExp31FamilyHeldOutVisualization_1.1/runs/slurm_51029080_86be29698eb6/visualization_manifest.json
    visualization_manifest_sha256: 90bc9e1b0421b838a7b35066ce785b3f8866e6e6b8f4f6cda640cafabad241a2
    reuse_rule: >-
      Bounds, seeds, IVD mesh, reference labels, 240 reference-selected center
