    numerical_git_commit: 7118af6c17b964b5561e6e297609f431f81aa020
    run_root: /ibex/user/zhanx0o/pathline-template-matching/Other_NegativeDistanceSpatial_1.1/runs/slurm_51039505_7118af6c17b9
    result_manifest: /ibex/user/zhanx0o/pathline-template-matching/Other_NegativeDistanceSpatial_1.1/runs/slurm_51039505_7118af6c17b9/result_manifest.json
