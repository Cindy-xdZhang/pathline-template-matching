experiment: Other_NegativeDistanceSpatialVisualization_1.1
category: Other
status: frozen_pre_run_not_run
purpose: audited_triptychs_for_the_fixed_negative_distance_spatial_candidate_on_four_requested_flows

evidence_scope:
  level: family_held_out_exposed_development_visualization_only
  formal_confirmation: false
  reason: >-
    The four query flows and the candidate-selection metrics were already
    exposed.  The figures localize the fixed candidate's errors but cannot
    establish unbiased cross-family generalization.
  forbidden_claims:
    - sealed_confirmation
    - unbiased_model_selection
    - aggregate_multisource_performance
    - clustering

parents:
  family_held_out_scenes:
    experiment: Other_MainExp31FamilyHeldOutVisualization_1.1
    numerical_git_commit: 86be29698eb689c0e269fe987a5b6d5f125a67be
