metrics:
  unit: dataset_source_ordinal_2_scale_block
  use_all_valid_query_rows: true
  invalid_rows_enter_only_coverage_denominator: true
  score: spatial_score
  required:
    - coverage
    - accuracy
    - average_precision
    - f1
    - balanced_accuracy
    - auroc
    - precision
    - recall
    - true_positive
    - false_positive
    - true_negative
    - false_negative
  comparison_to_parent_outer_group_metrics:
    required: exact_within_numeric_tolerance
    absolute_tolerance: 1.0e-12

figure_contract:
  core_conclusion: >-
    With the complete query physical family held out, the current NegativeTail
    FMT-template classifier localizes IVD-p95 vortex regions, with flow- and
    scale-block-specific false-positive and false-negative structure.
  results_level_question: >-
    Where do fixed source-ordinal-2 family-held-out predictions agree or
    disagree with IVD-p95 across the four requested flows?
  archetype: image_plate_plus_quantification
  backend: python_matplotlib
  figure_unit: one_dataset_by_one_scale_block
  expected_figure_count: 8
  final_size_inches: [21.0, 5.0]
  panel_titles:
    - IVD p95 + center pathlines
    - FMT NegativeTail template classification
    - TP / FP / FN / TN against IVD p95
  panel_map:
    a: unchanged_parent_IVD_p95_isosurface_plus_240_reference_selected_center_pathlines
    b: fixed_outer_fold_negative_tail_classification_for_every_valid_query_row
    c: exact_TP_FP_FN_TN_partition_for_the_same_rows_in_the_same_order
  display_pathlines:
    count: 240
    negative_count: 120
    positive_count: 120
    selection: unchanged_from_parent_reference_only_deterministic_maximin
    interpretation: balanced_explanatory_context_not_natural_class_prevalence
  identical_rows_camera_and_bounds_across_panels: true
  uncertainty: none_single_preregistered_source
  png_dpi: 360
  editable_svg_and_pdf_text: true
  rasterized_3d_marks: true
  required_exports:
    - scene_npz
    - scene_manifest_json
    - svg_with_editable_text_and_rasterized_3d_marks
    - pdf_with_editable_text_and_rasterized_3d_marks
    - png_360dpi
    - panel_alignment_json
    - render_metadata_json
  reviewer_risks:
    - all_four_flows_and_fitted_outer_fold_classifiers_are_exposed_development
    - fixed_top_5_percent_decision_is_transductive_within_each_dataset_source_block
    - coverage_differs_across_scale_blocks
    - 240_display_pathlines_are_balanced_context_not_the_natural_query_population
    - a_single_fixed_source_has_no_confidence_interval_and_does_not_replace_multisource_statistics

