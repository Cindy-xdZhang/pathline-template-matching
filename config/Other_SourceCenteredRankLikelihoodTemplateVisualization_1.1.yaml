figure_contract:
  core_conclusion: >-
    At fixed source ordinal 2, the primary source-rank likelihood template
    prediction has flow-specific spatial agreement and error structure relative
    to IVD p95.
  results_level_question: >-
    Where does the authenticated primary dual-histogram likelihood-ratio
    prediction agree or disagree with IVD p95 in each fixed flow?
  archetype: image_plate_plus_quantification
  backend: python_matplotlib
  figure_unit: one_dataset_with_both_scale_blocks_as_context
  expected_figure_count: 4
  final_size_inches: [21.0, 5.0]
  panel_titles:
    - IVD p95 + legacy/expanded center pathlines
    - Source-rank likelihood template classification
    - TP / FP / FN / TN against IVD p95
  panel_b_must_not_contain_FMT_label: true
  panel_map:
    a: unchanged_parent_IVD_mesh_plus_fixed_120_legacy_and_120_expanded_pathlines
    b: primary_dual_histogram_llr_prediction_on_every_combined_valid_unique_center
    c: exact_TP_FP_FN_TN_partition_of_the_same_centers_in_the_same_order
  evidence_hierarchy:
    physical_context: panel_a
    primary_spatial_evidence: panel_b
    error_localization_and_boundary: panel_c
    aggregate_controls: table_only_not_plotted
  background_pathlines:
    legacy_parent_scene_prefix_count: 120
    expanded_parent_scene_prefix_count: 120
    total_count: 240
    selection: fixed_array_prefix_without_prediction_label_or_metric_access
    block_encoding:
      legacy_2_1: {color: '#2468b4', linestyle: solid}
      expanded_3_1: {color: '#8e5ea2', linestyle: dashed}
    interpretation: block_context_only_not_classification_population_or_natural_prevalence
  plotted_population: combined_valid_unique_centers
  plotted_order: ascending_center_seed_index
  identical_center_order_camera_bounds_and_ivd_across_panels: true
  uncertainty: none_single_preregistered_source
  png_dpi: 360
  editable_svg_and_pdf_text: true
  rasterized_3d_marks: true
  rendered_text_minimum_points: 5.0
  panel_alignment_tolerance_points: 1.5
  required_exports:
    - combined_scene_npz
    - combined_scene_manifest_json
    - png_360dpi
    - svg_with_editable_text_and_rasterized_3d_marks
    - pdf_with_editable_text_and_rasterized_3d_marks
    - panel_alignment_json
    - render_metadata_json
    - pdf_text_audit_json
    - collision_audit_json
    - collision_overlay_pdf
  reviewer_risks:
    - all_four_flows_are_exposed_development
    - source_rank_normalization_uses_target_source_unlabeled_statistics
    - the_primary_representation_does_not_use_FMT_or_Raw_pathline_geometry
    - one_fixed_source_per_flow_has_no_confidence_interval
    - combined_valid_center_coverage_varies_by_flow
    - panel_a_pathlines_are_context_not_the_panel_b_population
    - valid_projection_metrics_count_a_both_valid_center_twice_and_are_not_plotted
    - figures_do_not_replace_complete_five_family_statistics

