shared_negative_scaler:
  fit_population: every_valid_natural_negative_row_from_all_current_fit_families
  population_is_shared_across_fit_families: true
  population_is_shared_across_both_class_libraries_and_queries: true
  balancing: none
  subsampling: none
  dtype_fit_and_storage: float64
  distance_dtype_after_transform: float32
  conditioning: exact_numeric_scale_id
  scale_blocks:
    legacy_2_1: [0, 999]
    expanded_3_1: [1000, 1999]
  local_mean: arithmetic_mean_of_all_fit_negative_rows_at_exact_scale
  local_variance: population_variance_ddof_0_about_exact_scale_local_mean
  block_other_prior: same_block_other_scales_after_each_other_scale_is_centered_by_its_own_local_mean
  global_other_prior: both_blocks_other_scales_with_same_per_scale_centering_only_if_block_other_has_zero_rows
  shrinkage_lambda: 64
  local_weight_formula: n_s/(n_s+64)
  variance_shrinkage_formula: local_weight*local_variance+(1-local_weight)*prior_variance
  shrinkage_domain: variance_before_square_root
  std_floor_exclusive: 1.0e-12
  zero_or_subfloor_effective_std: 1.0
  no_local_negative_scaler_row_policy: exact_scale_transform_and_retrieval_unsupported_so_calibration_cannot_activate
  transform_application: same_fitted_mean_and_effective_std_to_positive_library_negative_library_and_query
  scaler_refit_per_leave_one_out_row: false
  forbidden:
    - positive_fitted_scaler
    - class_specific_scaler
    - family_specific_scaler
    - query_or_outer_fitted_scaler
    - legacy_expanded_pooling_before_exact_scale_centering

family_class_exact_scale_conformity:
  distance: exact_euclidean_after_shared_negative_exact_scale_diagonal_standardization
  conditioning_fields: [fit_physical_family, class, exact_numeric_scale_id]
  ks: [1, 5, 15, 31]
  library_population: every_valid_natural_row_matching_fit_family_class_and_exact_scale
  library_balancing_or_subsampling: forbidden
  cross_family_pooling: forbidden
  cross_class_pooling: forbidden
  cross_scale_retrieval_library_pooling_or_fallback: forbidden
  cross_scale_calibration_reference_prior: same_family_same_class_only_as_frozen_below
  retrieval:
    query_distance: kth_nearest_distance_to_matching_family_class_exact_scale_library
    minimum_class_scale_count: k
    query_chunk_size: 1024
    library_chunk_size: 8192
  calibration:
    local_reference_population: leave_one_out_kth_nearest_distances_for_every_matching_library_row
    self_exclusion: set_only_current_row_distance_to_positive_infinity
    duplicate_policy: retain_all_other_rows_including_equal_and_zero_distance_duplicates
    scaler_refit_per_leave_one_out_row: false
    retrieval_minimum_class_scale_count: k
    local_reference_minimum_class_scale_count: k_plus_1
    empirical_upper_tail_formula: q=(1+count(reference_distance>=query_kth_distance))/(reference_count+1)
    equal_distance_policy: greater_than_or_equal_count_is_conservative_for_conformity
    shrinkage_lambda: 64
    local_weight_formula: local_reference_count/(local_reference_count+64)
    same_class_same_family_prior_order:
      - same_block_other_scale_LOO_references
      - other_block_LOO_references_only_if_same_block_other_is_empty
    reference_multisets:
      local: exact_scale_LOO_kth_distances
      block: all_same_block_scale_LOO_kth_distances_for_the_same_family_and_class
      block_other: multiset_difference_of_block_minus_local
      global_other: opposite_block_LOO_kth_distances_for_the_same_family_and_class
    local_reference_present_policy: >-
      Shrink the local empirical upper-tail conformity toward the first
      available same-family same-class prior; if no prior exists, use local
      conformity only.
    n_equals_k_policy: >-
      Exact-scale retrieval is supported but the local LOO reference is empty;
      calibration is supported only when the same family and same class has a
      same-block-other or other-block LOO prior.
    no_local_or_prior_reference_q: undefined
    calibration_modes:
      - local_block_shrink
      - local_global_shrink
      - local_only
      - block_fallback
      - global_fallback
      - none
    exact_mode_formulas:
      local_block_shrink:
        condition: local_nonempty_and_block_other_nonempty
        formula: q=local_weight*q(local)+(1-local_weight)*q(block_other)
      local_global_shrink:
        condition: local_nonempty_and_block_other_empty_and_global_other_nonempty
        formula: q=local_weight*q(local)+(1-local_weight)*q(global_other)
      local_only:
        condition: local_nonempty_and_block_other_and_global_other_empty
        formula: q=q(local)
      block_fallback:
        condition: local_empty_and_current_block_reference_nonempty
        formula: q=q(current_block_reference)
      global_fallback:
        condition: local_and_current_block_reference_empty_and_global_other_nonempty
        formula: q=q(global_other)
      none:
        condition: local_current_block_and_global_other_all_empty
        formula: q=undefined_and_calibration_unsupported
    every_q_reference_formula: (1+count(reference_distance>=query_kth_distance))/(reference_count+1)
  class_scores: [q_negative, q_positive]
  retrieval_fallback: forbidden
  calibration_prior_scope: same_family_and_same_class_only
  forbidden_calibration_prior_pooling:
    - cross_family
    - cross_class

joint_family_support_and_score:
  jointly_supported_family_definition: >-
    The same fit family has supported positive retrieval, positive conformity
    calibration, negative retrieval, and negative conformity calibration for
    the query representation, exact scale, and k.
  inner_gate:
    available_fit_families: 3
    minimum_jointly_supported_families: 2
    name: 2_of_3_joint_support
  final_outer_gate:
    available_fit_families: 4
    minimum_jointly_supported_families: 3
    name: 3_of_4_joint_support
  J: exact_set_of_jointly_supported_fit_families
  per_family_score: S_f=0.5*(1+q_positive-q_negative)
  final_raw_score: equal_weight_arithmetic_mean_of_S_f_over_J
  equivalent_final_raw_score: 0.5*(1+equal_mean_J_q_positive-equal_mean_J_q_negative)
  family_weights: exactly_equal
  row_count_reference_count_distance_prevalence_or_dataset_weighting: forbidden
  voting_or_ratio_interpretation: forbidden
  below_gate:
    raw_supported: false
    raw_score: 0.0
    prediction: negative_unless_later_mask_normalized_spatial_imputation_has_nonzero_support_denominator

group_transform:
  group_fields: [dataset, source_ordinal, scale_block]
  grid_shape_zyx: [40, 40, 40]
  input_score: raw_class_conditional_score_S
  input_support: passed_joint_family_support_gate
  gaussian_sigmas_grid_indices: [0.0, 0.5, 1.0, 1.5, 2.0]
  gaussian_truncate: 3.0
  sigma_zero_policy: joint_support_failure_score_zero_and_explicit_negative_rejection
  positive_sigma_policy: joint_support_mask_normalized_spatial_imputation
  positive_sigma_formula: G(S*joint_support)/G(joint_support)
  zero_denominator_policy: score_zero_and_explicit_negative_rejection
