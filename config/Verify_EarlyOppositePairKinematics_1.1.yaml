seed_time_sampling:
  primitive_order: [center, x_plus, x_minus, y_plus, y_minus, z_plus, z_minus]
  center_source: parent_seeds_xyz_indexed_by_valid_assigned_row_index
  relative_seed_time: 0.0
  absolute_source_time_use: provenance_only
  source_velocity_frame: portable_velocity_frame_zero
  center_time_audit:
    required: true
    formula: parent_center_sample_time[:,0]
    expected_value: 0.0
    absolute_tolerance: 1.0e-7
  minimum_spacing_formula: min(x[1]-x[0],y[1]-y[0],z[1]-z[0])
  coordinate_requirements:
    - finite
    - strictly_increasing
    - uniform_within_existing_portable_contract
  physical_dx_formula: explicit_mainExp_3_1_dx_grid_scale_at_valid_scale_id_times_minimum_spacing
  runtime_linspace_reconstruction: forbidden
  initial_positions:
    center: c
    x_plus: c_plus_h_e_x
    x_minus: c_minus_h_e_x
    y_plus: c_plus_h_e_y
    y_minus: c_minus_h_e_y
    z_plus: c_plus_h_e_z
    z_minus: c_minus_h_e_z
  interpolation: exact_same_corner_and_arithmetic_order_as_production_RK4_interp4_quadrilinear_scalar
  interpolation_at_seed_time: temporal_weight_zero_spatial_trilinear_on_portable_frame_zero
  velocity_input_dtype: float32
  velocity_output_dtype: float32
  outside_domain_or_nonfinite_policy: fail
  center_velocity_storage: required_for_audit_but_not_used_in_central_difference
  raw_first_pathline_segment_as_velocity: forbidden
  center_sample_time_as_a_surrogate_for_neighbour_line_times: forbidden

seed_time_kinematic4:
  derivative_compute_dtype: float64
  serialization_dtype: float32
  gradient_layout: velocity_component_rows_and_spatial_derivative_columns
  gradient_columns:
    x: (u_x_plus-u_x_minus)/(2*h)
    y: (u_y_plus-u_y_minus)/(2*h)
    z: (u_z_plus-u_z_minus)/(2*h)
  curl_formula:
    - G_2_1_minus_G_1_2
    - G_0_2_minus_G_2_0
    - G_1_0_minus_G_0_1
  strain_formula: S=(G+transpose(G))/2
  rotation_formula: Omega=(G-transpose(G))/2
  divergence_formula: trace(G)
  divergence_sign: preserved
  q_formula: Q=0.5*(frobenius_norm(Omega)^2-frobenius_norm(S)^2)
  feature_order:
    - l2_norm_of_curl
    - frobenius_norm_of_strain
    - signed_divergence
    - signed_Q
  feature_width: 4
  finite_required: true
  feature_transforms_before_fit_negative_scaler: none
  feature_weight_before_fit_negative_scaler: 1.0
  batch_or_flow_statistics: forbidden
  whole_volume_mean_vorticity_subtraction: forbidden
  algebraic_redundancy_note: Q_is_retained_by_pre_registration_even_though_it_is_determined_by_curl_norm_and_strain_norm

