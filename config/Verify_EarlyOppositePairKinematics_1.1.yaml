scientific_interpretation:
  descriptor_class: parameter_free_FMT_plus_Eulerian_seed_time_local_kinematic_augmentation
  not_a_pathline_history_only_descriptor: true
  label_proxy_risk: >-
    The IVD-p95 reference is derived from seed-time curl deviation, so a gain
    from local seed-time curl-related features must be reported as a direct
    kinematic baseline contribution, not as evidence that FMT geometry learned
    vortex structure.
  observer_risk: >-
    Curl magnitude and Q without a whole-volume mean-vorticity correction are
    not objective under a time-dependent rotating observer; no correction is
    allowed in this version because it would be another mechanism and could
    reproduce the label construction.
  scale_risk: >-
    Central differences from 0.125 through 2.5 loaded-grid spacings have
    scale-dependent cancellation and truncation error; exact-scale retrieval
    and the frozen per-scale negative metric remain mandatory.

