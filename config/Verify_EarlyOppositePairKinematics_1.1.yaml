  parent_descriptor_inputs: three_parent_FMT_representations_only
  current_descriptor_inputs: append_the_same_fixed_seed_time_kinematic4_to_each_parent_FMT_representation
  concatenation_weight: 1.0
  concurrent_kinematics_only_candidate: forbidden
  forbidden_concurrent_changes:
    - principal_component_analysis
    - learned_metric
    - global_negative_metric_reversion
    - per_scale_metric_or_lambda_change
    - tail_calibration_change
    - cross_scale_retrieval
