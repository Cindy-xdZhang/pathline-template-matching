research_question: >-
  Does appending a fixed, parameter-free four-dimensional seed-time local
  kinematic block, computed from the center and six opposite-neighbour initial
  velocities, improve exact-same-scale negative-template anomaly retrieval on
  held-out physical families while every PerScale metric, tail-calibration,
  spatial, decision, split, and success rule remains unchanged?

