    train_dataset_count: 8
    source_times_per_dataset: 4
    portable_window_count: 32
    completion_marker: TRAIN_PORTABLES_PASS.json
    completion_marker_rule: written_only_after_all_8_manifests_and_32_windows_are_loaded_and_size_file_sha256_verified_from_the_exact_commit
    test_window_or_cache_build: forbidden
    slurm_jobs_must_be_registered: true
  interphase_train_cache_build:
    prerequisite: valid_SYNTHETIC_PASS_and_TRAIN_PORTABLES_PASS_markers_with_recorded_file_sha256
    action: build_exactly_32_train_cache_shards
    train_dataset_count: 8
    source_times_per_dataset: 4
    cache_shard_count: 32
    cache_content: H48_two_assignment_blocks_128000_rows_per_source
    test_window_or_cache_build: forbidden
    slurm_jobs_must_be_registered: true
  phase_b_train_coverage:
    prerequisite: phase_a_marker_hash_and_all_32_train_cache_sidecars_pass_immutable_audit_and_carry_one_authenticated_TRAIN_PORTABLES_PASS_identity
    input_scope: exactly_32_train_cache_shards_and_sidecars_carrying_train_portable_marker_evidence_plus_frozen_configs_and_phase_a_marker
    raw_field_access: forbidden
    test_dataset_or_cache_access: forbidden
    phase_a_marker_sha256_must_be_recorded_in_final_verification: true
    run_directory_pattern: /ibex/user/zhanx0o/pathline-template-matching/mainExp_TemplateMatching_3.1_development/verification/Verify_LongArcHorizon_1.1/train_coverage/slurm_JOBID_COMMIT12
    existing_run_directory_action: fail
    required_outputs:
      - frozen_verify_config.yaml
      - frozen_main_config.yaml
      - train_cache_input_manifest.json
      - train_only_coverage_diagnostics.csv
      - train_only_coverage_summary.json
      - environment_versions.json
      - verification.json
      - TRAIN_COVERAGE_PASS.json
    completion_marker: TRAIN_COVERAGE_PASS.json
    completion_marker_write_order: last_after_verification_json_and_all_phase_b_outputs_are_fsynced
  final_status_rule: passed_only_when_both_markers_exist_both_phases_record_the_same_config_and_commit_hashes_and_phase_b_records_the_phase_a_marker_sha256

pre_run_known_blockers:
  - the verifier and 3.1 implementation tests must pass from the exact committed revision
  - all eight train datasets must satisfy the forty-nine-frame and four-unique-source-index contract
  - phase A must pass before any real train portable window is staged
  - all eight train manifests and all 32 train portable windows must pass the complete load size and file SHA-256 preflight before any train cache job is submitted
  - phase B must consume only the 32 immutable train caches and must record the phase A marker SHA-256
  - test paths must remain unopened throughout both Verify phases and the interphase train-cache build
  - no Verify_LongArcHorizon_1.1 result exists
