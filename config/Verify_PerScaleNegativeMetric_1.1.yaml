experiment: Verify_PerScaleNegativeMetric_1.1
phase: exposed_train_only_nested_family_validation
status: frozen_pre_run_not_implemented
frozen_before_parent_outer_results: Verify_NegativeTailCalibration_1.1
parent_experiments:
  - mainExp_TemplateMatching_3.1
  - Other_NegativeDistanceSpatial_1.1
  - Verify_ScaleConditionedRetrieval_1.1
  - Verify_NegativeTailCalibration_1.1

research_question: >-
  Does replacing the parent global negative-only diagonal variance with a
  fit-negative exact-per-scale shrunk diagonal within-scale variance improve
  same-scale FMT distance ordering and held-out-family F1 while leaving the
  negative-tail calibration and every candidate rule unchanged?

single_mechanism_change:
  parent_feature_metric: global_negative_only_diagonal_population_variance
  current_feature_metric: fit_negative_per_scale_shrunk_diagonal_within_scale_population_variance
  unchanged_score_transform: fit_negative_scale_tail_anomaly
  forbidden_concurrent_changes:
    - principal_component_analysis
    - learned_metric
    - kinematic_features
    - descriptor_change
    - cross_scale_retrieval
    - tail_calibration_change
    - representation_grid_change
    - k_grid_change
    - spatial_sigma_grid_change
    - decision_grid_change
    - nested_split_change
    - success_stop_rule_change

evidence_scope:
  level: exposed_development_only
  formal_confirmation: false
  allowed_inputs: mainExp_TemplateMatching_3.1_train_caches_only
  forbidden_datasets: [tangaroa, smokeBuoyancy]
  forbidden_claims: [sealed_confirmation, conformal_coverage, independent_full_classifier]

