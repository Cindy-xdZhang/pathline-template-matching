families:
  half_cylinder: [cylinder3d, halfcylinderRe640, halfcylinderRe6400]
  delta_wing: [deltaWing_resampled, deltaWing_LBM]
  f22_raptor: [f22raptor]
  channel: [channel]
  boeing_747: [boeing747]

nested_split:
  outer_order: [half_cylinder, delta_wing, f22_raptor, channel, boeing_747]
  inner_order: [half_cylinder, delta_wing, f22_raptor, channel, boeing_747]
  outer_unit: complete_physical_family
  inner_unit: complete_physical_family
  source_window_unit: complete_source_plus_48_future_frame_horizon
  random_seed_split: forbidden
  outer_labels_available_to_selection: false
  selection_aggregation: equal_dataset_source_block_groups_within_family_then_equal_inner_families

library:
  class: negative_only
  population: every_valid_natural_negative_row_from_fit_families
  balancing: none
  subsampling: none
  scaler: fit_negative_exact_per_scale_mean_and_shrunk_within_scale_population_std
  scaler_dtype: float64
  distance_dtype: float32
  scale_blocks:
    legacy_2_1: [0, 999]
    expanded_3_1: [1000, 1999]
  local_mean: arithmetic_mean_of_fit_negative_rows_at_exact_scale
  local_variance_ddof: 0
  local_variance_formula: sum_squared_residuals_about_exact_scale_mean_divided_by_exact_scale_row_count
  block_other_prior_population: same_block_other_scales_fit_negative_rows_only
  block_other_prior_centering: each_other_scale_uses_its_own_local_mean
  block_other_prior_formula: pooled_sum_of_other_scale_within_scale_squared_residuals_divided_by_other_scale_row_count
  block_other_prior_excludes:
    - current_scale
    - between_scale_mean_differences
  global_other_prior_population: both_blocks_all_other_scales_fit_negative_rows_only
  global_other_prior_centering: each_other_scale_uses_its_own_local_mean
  global_other_prior_formula: pooled_sum_of_other_scale_within_scale_squared_residuals_divided_by_other_scale_row_count
  global_other_prior_excludes:
    - current_scale
    - between_scale_mean_differences
  global_other_prior_use: only_when_block_other_row_count_is_zero
  shrinkage_lambda: 64
  shrinkage_lambda_source: assigned_rows_per_source_block_scale_from_mainexp_3_1_design
  local_weight_formula: exact_scale_row_count_divided_by_exact_scale_row_count_plus_64
  variance_shrinkage_formula: local_weight_times_local_variance_plus_one_minus_local_weight_times_prior_variance
  shrinkage_domain: variance_before_square_root
  broader_prior_fallback_order:
    - block_other
    - global_other_only_if_block_other_empty
    - local_only_if_all_other_scales_empty
  std_floor_exclusive: 1.0e-12
  effective_std_formula: square_root_of_shrunk_variance_unless_shrunk_std_strictly_less_than_1e_12_then_one
  zero_or_subfloor_effective_std: 1.0
  query_and_library_transform: same_fit_only_exact_scale_mean_and_effective_std
  mean_metric_effect: cancels_exactly_in_same_scale_euclidean_difference
  mechanism_metric_effect: exact_scale_effective_std_only
  scaler_refit_per_leave_one_out_row: false
  no_local_row_policy: no_scale_library_and_retrieval_unsupported
  synthetic_or_broader_library_rows: forbidden
  scaler_modes:
    no_local_rows: 0
    local_block_shrink: 1
    local_global_shrink: 2
    local_only: 3

representations:
  order: [fmt161, real_neighbor36, chirality_all35]
  fmt161:
    definition: all_seven_contiguous_23d_FMT_line_blocks
    width: 161
  real_neighbor36:
    definition: six_neighbor_lines_times_local_indices_0_3_6_9_12_15
    width: 36
  chirality_all35:
    definition: seven_lines_times_local_indices_18_through_22
    width: 35

retrieval:
  distance: exact_euclidean_after_fit_negative_exact_scale_diagonal_standardization
  conditioning: exact_numeric_scale_id
  ks: [1, 5, 15, 31]
  query_chunk_size: 1024
  library_chunk_size: 8192
  score_before_calibration: kth_nearest_negative_distance
  cross_scale_distance: forbidden
  support_count_source: fit_family_negative_rows_only

negative_tail_calibration:
  reference_population: fit_family_natural_negative_rows_only
  scaler_refit_per_leave_one_out_row: false
  leave_one_out_definition: explicit_self_row_exclusion_after_one_fit_negative_per_scale_scaler_fit
  self_exclusion_implementation: current_row_distance_set_to_positive_infinity
  duplicate_feature_policy: exclude_only_current_row_and_retain_other_zero_distance_rows
  multi_k_search: one_exact_maximum_supported_k_pass_per_scale
  local_reference_minimum_count: k_plus_1_negative_rows
  tail_probability_formula: one_plus_count_reference_greater_than_or_equal_to_distance_divided_by_reference_count_plus_one
  anomaly_score_formula: count_reference_strictly_less_than_distance_divided_by_reference_count_plus_one
  equal_distance_policy: conservative_larger_tail_probability
  scale_blocks:
    legacy_2_1: [0, 999]
    expanded_3_1: [1000, 1999]
  shrinkage_lambda: 64
  shrinkage_lambda_source: assigned_rows_per_source_block_scale_from_mainexp_3_1_design
  local_weight_formula: local_reference_count_divided_by_local_reference_count_plus_64
  block_other_reference: same_block_all_other_scales_only
  global_other_reference: both_blocks_all_other_scales_only
  fallback_order:
    - local_plus_block_other_shrinkage
    - local_plus_global_other_shrinkage
    - local_only
    - block_other_only
    - global_other_only
    - unsupported
  retrieval_support_rule: scale_negative_count_greater_than_or_equal_to_k
  local_reference_rule: scale_negative_count_greater_than_or_equal_to_k_plus_1
  no_reference_tail_probability: 1.0
  no_reference_anomaly_score: 0.0
  calibration_modes:
    no_calibration: 0
    local_block_shrink: 1
    local_global_shrink: 2
    local_only: 3
    block_fallback: 4
    global_fallback: 5

group_transform:
  group_fields: [dataset, source_ordinal, scale_block]
  grid_shape_zyx: [40, 40, 40]
  query_group_rank: forbidden
  input_score: fit_negative_tail_anomaly
  gaussian_sigmas_grid_indices: [0.0, 0.5, 1.0, 1.5, 2.0]
  gaussian_truncate: 3.0
  sigma_zero_policy: calibration_unsupported_score_zero_and_explicit_negative_rejection
  positive_sigma_policy: calibration_support_mask_normalized_spatial_imputation
  positive_sigma_formula: G(tail_anomaly_times_calibration_support)_divided_by_G(calibration_support)
  zero_denominator_policy: score_zero_and_explicit_negative_rejection
  cross_dataset_source_or_block_smoothing: forbidden
  classifier_minimum_query_batch: complete_valid_source_times_scale_block_grid

