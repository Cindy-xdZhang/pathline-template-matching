research_question: >-
  Does replacing the parent's three candidate FMT representations with one
  fixed train-only Raw672 Principal Component Analysis representation of width
  161 improve exact-scale negative-distance ordering and held-out-family F1,
  while preserving the parent's per-scale negative metric, negative-tail
  calibration, spatial transform, decision search, nested split, and stop rule?

