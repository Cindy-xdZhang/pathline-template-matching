principal_component_analysis:
  full_name: Principal Component Analysis
  representation_id: raw_pca161
  input_width: 672
  output_width: 161
  output_width_source: inherited_fixed_mainexp_3_1_raw_pca_control
  output_width_search: forbidden
  fit_population: every_valid_raw_row_from_current_fit_families_irrespective_of_label
  fit_label_member_access: forbidden
  fit_balancing: none
  fit_subsampling: none
  query_row_use_in_fit: forbidden
  parent_all_eight_family_pca_artifact_reuse: forbidden
  mainexp_2_1_pca_artifact_reuse: forbidden
  cache_iteration_order:
    - frozen_family_order
    - frozen_dataset_order_within_family
    - source_ordinal_ascending
    - stored_valid_row_order
  solver: deterministic_two_pass_streaming_covariance_eigendecomposition
  algebraic_reference: right_singular_vectors_of_the_centered_fit_matrix
  first_pass:
    feature_sum_dtype: float64
    sample_count_dtype: int64
    mean_formula: feature_sum_divided_by_sample_count
    minimum_sample_count: 2
  second_pass:
    row_chunk_size: 8192
    raw_cast_dtype: float64
    centered_formula: raw_float64_minus_first_pass_mean_float64
    scatter_accumulator_dtype: float64
    scatter_formula: sum_of_centered_transpose_times_centered
    second_pass_count_must_equal_first_pass_count: true
  eigendecomposition:
    symmetrization: one_half_times_scatter_plus_scatter_transpose
    solver: numpy_linalg_eigh
    descending_order: stable_argsort_of_negative_eigenvalues
    materially_negative_tolerance_formula: max_1e_minus_12_and_largest_nonnegative_eigenvalue_times_1e_minus_10
    materially_negative_eigenvalue_policy: fail_closed
    remaining_negative_eigenvalue_policy: clamp_to_zero
    selected_components: first_161_descending_eigenvectors_as_rows
  sign_freeze:
    pivot: first_argmax_absolute_loading_per_component
    rule: pivot_loading_nonnegative
    zero_sign: positive_one
  singular_value_formula: square_root_of_selected_clamped_eigenvalues
  explained_variance_ratio_formula: selected_clamped_eigenvalue_divided_by_sum_of_all_672_clamped_eigenvalues
  zero_total_variance_ratio: all_zero
  serialized_mean_dtype: float32
  serialized_components_dtype: float32
  serialized_singular_values_dtype: float64
  serialized_explained_variance_ratio_dtype: float64
  transform_formula: contiguous_float32_of_raw_float32_minus_mean_float32_times_components_float32_transpose
  whitening: false
  post_transform_global_standardization: false
  expected_sample_counts:
