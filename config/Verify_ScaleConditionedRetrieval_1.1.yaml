selection:
  eligible_evidence: inner_out_of_family_groups_only
  aggregation_stage_1: equal_dataset_source_block_groups_within_each_inner_family
  aggregation_stage_2: equal_inner_family_macro
  expected_inner_family_count_per_outer_fold: 4
  primary: highest_equal_inner_family_macro_f1
  tie_break_order:
    - highest_equal_inner_family_macro_average_precision
    - highest_equal_inner_family_macro_balanced_accuracy
    - highest_equal_inner_family_macro_precision
    - highest_equal_inner_family_macro_recall
    - lexicographically_smallest_candidate_id
  outer_family_metric_or_label_use: forbidden

metrics:
  - accuracy
  - average_precision
  - f1
  - balanced_accuracy
  - auroc
  - precision
  - recall
  - retrieval_support_fraction
  - spatial_imputed_fraction
  - spatial_unimputable_fraction
  - true_positive
  - false_positive
  - true_negative
  - false_negative
  - sample_count
  - positive_count
  - negative_count
  - supported_count
  - imputed_count
  - unimputable_count
  - supported_subset_f1
  - imputed_subset_f1
  - unimputable_subset_f1

success_stop_rule:
  outer_family_macro_f1_minimum: 0.70
  outer_families_at_or_above_0_65_minimum: 4
  minimum_single_outer_family_f1: 0.50
  outer_family_macro_average_precision_minimum: 0.60
  outer_family_macro_balanced_accuracy_minimum: 0.70
  outer_family_macro_precision_minimum: 0.60
  outer_family_macro_recall_minimum: 0.60
  threshold_changes_after_outer_results: forbidden

output:
  root: /ibex/user/zhanx0o/pathline-template-matching/Verify_ScaleConditionedRetrieval_1.1
  fold_directory_pattern: runs/slurm_JOBID_ARRAYTASK_COMMIT12_outer_FAMILY
  overwrite: forbidden
  predictions_written_before_outer_reference_open: true
  required_fold_files:
    - inner_group_metrics.csv
    - inner_candidate_summary.csv
    - selected_candidate.json
    - outer_predictions.npz
    - outer_prediction_manifest.json
    - outer_group_metrics.csv
    - outer_summary.json
    - result_manifest.json
    - RUN_COMPLETE.json
