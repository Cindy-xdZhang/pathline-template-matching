assigned_row_source_centering:
  primitive_order: [center, x_plus, x_minus, y_plus, y_minus, z_plus, z_minus]
  sampling_time: portable_velocity_frame_zero
  velocity_interpolation: exact_production_quadrilinear_interpolator
  gradient_compute_dtype: float64
  velocity_storage_dtype: float32
  feature_storage_dtype: float32
  gradient_layout: velocity_component_rows_spatial_derivative_columns
  spatial_derivatives:
    x: (velocity_x_plus_minus_velocity_x_minus)/(2*physical_dx)
    y: (velocity_y_plus_minus_velocity_y_minus)/(2*physical_dx)
    z: (velocity_z_plus_minus_velocity_z_minus)/(2*physical_dx)
  curl_order:
    - G_2_1_minus_G_1_2
    - G_0_2_minus_G_2_0
    - G_1_0_minus_G_0_1
  mean_group_fields: [dataset, source_ordinal, scale_block, dx_level]
  scale_blocks:
    legacy_2_1: [0, 999]
    expanded_3_1: [1000, 1999]
  dx_levels_per_block: 10
  ds_levels_per_dx: 10
  arc_levels_per_dx_ds: 10
  assigned_centers_per_exact_scale: 64
  required_rows_per_mean_group: 6400
  mean_population: all_assigned_rows_including_pathline_invalid_rows
  mean_formula: arithmetic_mean_of_three_component_curl
  validity_or_reference_filter_for_mean: forbidden
  centered_feature_order:
    - l2_norm_of_curl_minus_group_mean_curl
    - frobenius_norm_of_strain
    - signed_divergence
    - signed_Q_using_centered_curl
  signed_Q_formula: 0.25*centered_curl_norm_squared-0.5*strain_norm_squared
  exact_forbidden_parent_members_during_sidecar_build:
    - valid_labels
    - reference_labels_all
    - ivd_values_all
    - ivd_volume
    - valid_mask
    - metadata_json
    - fmt_features
    - raw_features
  allowed_parent_members_during_sidecar_build:
    - seeds_xyz
    - scale_assignment
    - valid_assigned_row_index
    - valid_center_seed_index
    - valid_scale_block_index
    - valid_scale_id
  whole_volume_vorticity_or_ivd_mean_access: forbidden
  interpretation: >-
    The mean is an unlabeled estimate from the assigned interior center grid,
    not the whole-volume mean used to construct the IVD reference.  The full
    classifier is therefore target-unlabeled and transductive even though the
    FMT coordinates remain independently encoded per primitive.

