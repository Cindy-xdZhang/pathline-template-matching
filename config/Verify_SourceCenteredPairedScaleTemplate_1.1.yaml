  minimum_single_family_f1: 0.50
  five_family_macro_average_precision_minimum: 0.60
  five_family_macro_balanced_accuracy_minimum: 0.70
  five_family_macro_precision_minimum: 0.60
  five_family_macro_recall_minimum: 0.60
  unique_center_combined_coverage_minimum: 0.90
  paired_bootstrap_f1_difference_lower_95_percent_bound_strictly_above: 0.0
  any_single_fold_success_claim: forbidden
  changes_after_outer_results: forbidden

authenticated_stop_rule:
  - any_completed_outer_family_f1_strictly_below_0_50
  - two_completed_outer_family_f1_values_strictly_below_0_65
  - optimistic_remaining_families_cannot_satisfy_any_complete_five_threshold

interpretation_rules:
  - A gain from source-centered curl must be reported as a direct local kinematic contribution, not as evidence that independent FMT geometry learned vortex structure.
  - The source mean uses target-flow unlabeled velocities, so the complete classifier is transductive.
  - This version remains a negative-template anomaly matcher; the decision fraction is selected only on inner physical families from the frozen grid and never from outer prevalence or labels.
  - Legacy and expanded coverage and metrics must both be reported; neither block may be deleted after results.
  - Either direct source-centered diagnostic may identify representation headroom, but neither can satisfy the template-method success rule.
  - Failure, partial, timeout, cancelled, superseded, and negative outputs must be retained.

