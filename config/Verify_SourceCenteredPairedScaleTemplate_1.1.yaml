negative_template_score:
  library_class: natural_negative_only
  library_population: every_valid_fit_family_negative_row
  balancing: none
  subsampling: none
  scaler: fit_negative_exact_per_scale_mean_and_shrunk_within_scale_population_std
  scaler_dtype: float64
  distance_dtype: float32
  local_variance_ddof: 0
  shrinkage_lambda: 64
  std_floor_exclusive: 1.0e-12
  no_local_row_policy: unsupported
  retrieval_distance: exact_euclidean_after_fit_negative_exact_scale_diagonal_standardization
  retrieval_conditioning: exact_numeric_scale_id
  k_values: [1, 5, 15, 31]
  query_chunk_size: 1024
  library_chunk_size: 8192
  score_before_calibration: kth_nearest_negative_distance
  calibration: fit_negative_exact_scale_leave_one_out_upper_tail_anomaly
  calibration_shrinkage_lambda: 64
  cross_scale_retrieval: forbidden
  spatial_transform:
    grid_shape_zyx: [40, 40, 40]
    input: fit_negative_tail_anomaly
    gaussian_sigmas_grid_indices: [0.0, 0.5, 1.0, 1.5, 2.0]
    gaussian_truncate: 3.0
    missing_support: mask_normalized_imputation
    cross_dataset_or_source_smoothing: forbidden

paired_center_fusion:
  join_fields: [dataset, source_ordinal, center_seed_index]
  required_block_identities: [legacy_2_1, expanded_3_1]
  reference_access_during_join: forbidden
  both_eligible_formula: weight*legacy_score+(1-weight)*expanded_score
  legacy_only_formula: legacy_score
  expanded_only_formula: expanded_score
  neither_eligible_formula: 0.0
  eligible_if: (calibration_supported_or_spatially_imputed)_and_strictly_positive_score
  weights: [0.00, 0.25, 0.50, 0.75, 1.00]
  note_for_weight_one: expanded_only_centers_still_use_expanded_score
  prediction_unit: unique_center
  prediction_population_per_dataset_source: all_64000_centers
  decision_rule: fixed_top_fraction
  top_fraction_values: [0.025, 0.04, 0.05, 0.06, 0.075, 0.10]
  top_fraction_selection: inner_physical_families_only
  target_positive_count: ceil_selected_fraction_times_64000_capped_by_eligible_centers
  tie_break: descending_score_then_ascending_center_seed_index
  row_projection: copy_one_center_prediction_to_each_corresponding_valid_block_row
  primary_metric_population: all_parent_valid_rows_after_exact_center_projection
  unique_center_metric_population: centers_with_at_least_one_valid_block
  neither_valid_centers_in_primary_classification_metrics: false

