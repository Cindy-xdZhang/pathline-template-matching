primary_rank_likelihood_template:
  arm_id: dual_histogram_llr
  status: primary_template_method
  library_classes: [natural_negative, natural_positive]
  library_unit: one_combined_valid_center_once
  histogram_input: fused_rank
  histogram_domain: [0.0, 1.0]
  bin_counts: [64, 128, 256]
  bin_edges_formula: edge_j=j/B_for_j_0_through_B
  bin_index_formula: min(B-1,floor(B*fused_rank))
  additive_beta_values: [0.5, 2.0]
  family_class_probability_formula: (count_family_class_bin+beta)/(count_family_class+B*beta)
  class_probability_formula: arithmetic_mean_of_family_class_probabilities_over_fit_families
  raw_log_likelihood_ratio_formula: log(mean_family_positive_probability)-log(mean_family_negative_probability)
  family_count_weighting_in_class_probability: equal
  all_fit_families_and_both_classes_required: true
  missing_family_or_class_policy: fail
  probability_and_log_dtype: float64
  fit_label_access: allowed_for_fit_families_only
  outer_label_access: forbidden_until_prediction_gate
  calibration:
    name: leave_one_source_out_fit_negative_family_ecdf
    reference_population: every_combined_valid_fit_negative_center
    for_each_reference_row: >-
      Exclude every template center with the same dataset and source ordinal,
      rebuild all affected family/class histograms and the equal-family class
      probabilities, and evaluate that negative center's raw likelihood ratio.
    rank_values_recomputed_after_source_exclusion: false
    reference_partition: physical_family_of_the_held_out_negative_center
    query_raw_score_model: full_fit_histograms_without_any_source_exclusion
    per_family_anomaly_formula: count(reference_score_strictly_less_than_query_llr)/(reference_count+1)
    calibrated_score_formula: arithmetic_mean_of_per_family_anomalies_over_fit_families
    tied_reference_score_policy: conservative_not_counted_as_less
    all_fit_family_reference_sets_required_nonempty: true
    calibration_shrinkage: none
    calibration_dtype: float64

negative_ecdf_control:
  arm_id: negative_ecdf
  status: independently_inner_selected_control_not_primary_success
  uses_positive_templates: false
  library_population: every_combined_valid_fit_negative_center_once
  reference_partition: physical_family
  query_input: fused_rank
  per_family_anomaly_formula: count(fit_negative_fused_rank_strictly_less_than_query_rank)/(negative_count+1)
  score_formula: arithmetic_mean_of_per_family_anomalies_over_fit_families
  family_weighting: equal
