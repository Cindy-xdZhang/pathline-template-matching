  grid_shape_zyx: [40, 40, 40]
  center_order: exact_center_seed_index_0_through_63999
  input: family_balanced_calibrated_anomaly_score
  support_mask: combined_valid_centers_only
  gaussian_sigmas_grid_indices: [0.0, 0.5, 1.0]
  gaussian_truncate: 3.0
  positive_sigma_formula: G(score_times_support_mask)/G(support_mask)
  zero_sigma_formula: unchanged_score_on_combined_valid_centers
  prediction_eligibility_after_smoothing: combined_valid_centers_only
  cross_dataset_source_or_outer_smoothing: forbidden

