interpretation_rules:
  - The complete method is transductive because every query source supplies all assigned rows for its own rank normalization and may supply its combined-valid spatial mask.
  - The primary representation is the first source-centered seed-time curl coordinate; it does not use FMT pathline geometry, Raw pathline geometry, strain, divergence, or Q.
  - A gain may be described only as evidence that a labeled rank-likelihood template preserves direct local curl ordering better than the parent's high-dimensional symmetric distance.
  - A gain must not be described as evidence that independent FMT geometry learned vortex structure.
  - The dual histogram likelihood-ratio arm is template matching because both labeled positive and negative fit-center distributions define its score; the fixed direct top-five-percent diagnostic is not template matching.
  - The negative-ECDF control and direct diagnostic cannot satisfy the primary success rule even if either exceeds every numerical threshold.
  - All eight flows are exposed development data, so this verification is not formal confirmation on unseen physical families.
  - Failure, partial, timeout, cancelled, superseded, and negative outputs must be retained.

