scale_assignment:
  assignment_count_per_seed: 2
  assignment_scope: independently_restarted_for_each_dataset_source_time_and_block
  algorithm: deterministic_balanced_permutation_modulo_per_block
  random_generator: numpy_Generator_PCG64
  blocks:
    - id: legacy_2_1
      seed: 15068
    - id: expanded_3_1
      seed: 35068
  seed_selection_rationale: legacy_seed_is_inherited_and_35068_was_frozen_a_priori_without_test_data_or_metrics
  legacy_mapping_contract: exact_parent_mapping_from_seed_index_to_scale_id_for_all_64000_seed_indices
  legacy_assignment_canonical_sha256: 21cdb937f57baf1a786a6a4622870e234074b684e5a5cda4c4271837631e0fee
  legacy_assignment_hash_rule: project_each_source_legacy_block_to_the_scale_id_assignment_array_then_use_project_canonical_array_sha256
  legacy_assignment_hash_required_for_every_dataset_source_time: true
  formula: "assignment_block[permutation[j]] = scale_id_start + (j mod 1000) for j=0..63999"
  assigned_seeds_per_scale_per_source_time_per_block: 64
  imbalance_tolerance: 0
  independent_of: [coordinates, velocity, IVD, reference_class, validity]

population:
  source_window_count: 40
  assigned_primitives_per_source_time: 128000
  assigned_train_primitives: 4096000
  assigned_test_primitives: 1024000
  assigned_total_primitives: 5120000
  valid_population_rule: all_seven_lines_must_reach_target_within_H48
  parent_population_or_cache_reuse: forbidden

primitive:
  dimension: 3
  line_order: [center, x_plus, x_minus, y_plus, y_minus, z_plus, z_minus]
  line_count: 7
  sampled_points_per_line: 32
  direction: forward_only
  integration_method: RK4
  integration_time_step: scale_protocol.physical_conversion.rk4_time_step
  maximum_integration_time: scale_protocol.physical_conversion.maximum_integration_time
  maximum_future_horizon_frames: 48
  horizon_is_part_of_cache_and_primitive_identity: true
  horizon_step_rule: clamp_the_final_RK4_step_to_the_exact_remaining_time_without_integrating_past_forty_eight_frames
  target_length: scale_protocol.physical_conversion.target_spatial_arc_length
  target_crossing_rule: linearly_truncate_the_last_integrated_polyline_segment_at_exact_target_cumulative_spatial_arc_length
  resampling: uniform_spatial_arc_length_including_both_endpoints
  resampling_positions: "target_arc_length * j / 31 for j=0..31"
  resampling_interpolation: piecewise_linear_in_cumulative_spatial_arc_length
  integrator_output_channels: [x, y, z, t]
  descriptor_input_channels: [x, y, z]
  centering: subtract_center_line_initial_xyz_from_all_seven_lines
  validity_rule: all_seven_lines_reach_the_target_arc_length_before_or_at_the_forty_eight_frame_horizon
  invalid_conditions:
    - any line exits the loaded spatial domain before reaching target length
    - any line fails to reach target length by the maximum integration time
    - any nonfinite coordinate, velocity, time, or cumulative length occurs
    - arc-length interpolation cannot produce 32 finite ordered samples
  partial_primitive_retention: forbidden
  parent_H12_primitive_cache_compatibility: forbidden

label:
  name: whole_loaded_volume_ivd_p95
  definition: "norm(curl(v) - spatial_mean_loaded_volume(curl(v)))"
  source_time: exact_selected_source_frame
  loaded_spatial_stride_xyz: per_dataset_recorded_stride_from_source_loading
  ivd_volume_scope: entire_loaded_strided_spatial_volume_at_source_time
  native_full_resolution_label_claim: forbidden
  percentile: "95.000000000000"
  percentile_method: linear
  comparison: greater_than_or_equal
  seed_value_sampling: trilinear_spatial_interpolation
  temporal_interpolation: none_exact_source_frame
  attached_to: shared_center_seed_before_integration
  scale_independent: true
  required_audit:
    - numeric_threshold_per_dataset_source_time
    - native_and_loaded_volume_shapes_spacing_bounds_and_per_dataset_stride
    - volume_and_unique_center_seed_positive_fraction
    - assigned_positive_fraction_per_scale_block
    - canonical_ivd_array_sha256

