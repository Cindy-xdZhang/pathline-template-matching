protocol_gates:
  - implementation tests must pass from the exact committed revision used on Ibex
  - Verify_LongArcHorizon_1.1 phase A synthetic must use the production field and integrator and write SYNTHETIC_PASS before any real cache construction
  - exactly 32 train cache shards may be built only after phase A passes; no test window or cache may be opened in this interphase step
  - TRAIN_PORTABLES_PASS must prove all eight train manifests and all thirty-two portable windows were loaded and file-hashed from the exact commit before any train cache job is submitted
  - Verify_LongArcHorizon_1.1 phase B must consume only those 32 train caches, record the phase A marker hash, and pass before any test cache is built or read
  - every expanded-block arc-length level must have at least one valid train primitive
  - the expanded block must yield at least one selected positive and one selected negative train template globally
  - all forty-nine-frame portable windows and canonical hashes must succeed for all ten datasets
  - ALL_PORTABLES_PASS must prove all ten manifests and all forty portable windows were loaded and file-hashed after phase B and before any test cache job is submitted
  - immutable cache sidecars may be parsed only in one automatic manifest-freezing step to assemble and validate the input manifest; no sidecar value may be reported or used for a decision before that manifest is frozen
  - test NPZ arrays, predictions, labels, coverage calculations, and metrics may not be opened or evaluated until config, code commit, and input manifest are frozen
  - a failed gate cannot delete tuples from 3.1; any method change requires a new experiment version

split:
  method: fixed_eight_train_two_test_by_complete_physical_family
  selection_basis: inherited_exactly_from_mainExp_TemplateMatching_2.1
  train_datasets:
    - cylinder3d
    - halfcylinderRe640
    - halfcylinderRe6400
    - deltaWing_resampled
    - deltaWing_LBM
    - f22raptor
    - channel
    - boeing747
  test_datasets:
    - tangaroa
    - smokeBuoyancy
  train_physical_families:
    half_cylinder: [cylinder3d, halfcylinderRe640, halfcylinderRe6400]
    delta_wing: [deltaWing_resampled, deltaWing_LBM]
    f22_raptor: [f22raptor]
    channel: [channel]
    boeing_747: [boeing747]
  test_physical_families:
    tangaroa: [tangaroa]
    smoke_buoyancy: [smokeBuoyancy]
  leakage_guards:
    - no physical family appears in both train and test
    - every source timeslice and its complete forty-eight-frame future horizon remain in one partition
    - test primitives, labels, validity, coverage, matches, and metrics cannot fit or select any method component
    - mainExp_TemplateMatching_2.1 test results cannot select, delete, or reweight 3.1 tuples
    - no test-driven horizon, threshold, scale deletion, validity replacement, or resampling is allowed

source_times:
  count_per_dataset: 4
  time_axis_requirement: uniform_strictly_increasing
  maximum_future_horizon_frames: "48.000000000000"
  horizon_is_part_of_primitive_and_cache_identity: true
  minimum_required_frame_count: 52
  minimum_frame_count_reason: forty_nine_frames_are_loaded_per_window_and_four_unique_floor_spaced_source_indices_require_frame_count_minus_49_at_least_3
  eligible_source_index_range: "0 through frame_count - 49 inclusive"
  selection_formula: "source_index[k] = floor(k * (frame_count - 49) / 3), k in [0,1,2,3]"
  uniqueness_requirement: four_unique_indices_or_fail
  selection_dependencies: [time_axis_length_only]
  field_value_or_label_dependent_selection: forbidden

source_loading:
  max_spatial_dim: 96
  native_axis_lengths: [x_native_count, y_native_count, z_native_count]
  per_axis_stride_formula: "stride_axis = ceil(native_axis_count / 96)"
  required_recorded_stride_order: [x, y, z]
  spatial_slice_rule: "native_axis[0::stride_axis]"
  loaded_axis_maximum_count: 96
  temporal_stride: 1
  derived_window_frame_count: 49
  derived_window_scope: four_source_windows_from_the_loaded_strided_spatial_volume
  parent_thirteen_frame_window_reuse: forbidden
  stride_or_window_selection_using_velocity_ivd_label_or_validity: forbidden
  netcdf_coordinate_policy:
    default: require_finite_physical_coordinates_for_x_y_z_t
    dataset_overrides:
      f22raptor:
        axes: [x, y, z, t]
        action: explicit_integer_index_coordinates
        reason: all_four_registered_coordinate_variables_are_fully_masked
    implicit_coordinate_fallback: forbidden
  channel_vtk_contract:
    source_type: steady_structured_grid_with_velocity_point_array
    derived_unsteady_series: deterministic_killing_observer
    total_frames: 159
    duration: 1.000000000000
    crop_fraction: 0.100000000000
    output_spatial_policy: cropped_regular_resampling_with_each_axis_at_most_96
    observer_source_sha256: aaaaaedee75e3ab9b106ec6a6c0a7fd5a415b319c8d596107cff9cbd614cf752
